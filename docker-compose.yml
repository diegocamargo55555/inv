services:
  postgres:
    image: postgres:16-alpine
    container_name: inv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres123}
      POSTGRES_DB: ${DB_NAME:-invest_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-invest_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - inv_network

  redis:
    image: redis:7-alpine
    container_name: inv_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - inv_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inv_backend
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-development}
      - HTTP_PORT=${HTTP_PORT:-8081}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASS:-postgres123}
      - DB_NAME=${DB_NAME:-invest_db}
      - DB_SSLMODE=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - JWT_SECRET=${JWT_SECRET:-supersecret-jwt-key-for-dev-only-32chars}
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=168h
      - BRAPI_TOKEN=${BRAPI_TOKEN:-}
      - FINNHUB_TOKEN=${FINNHUB_TOKEN:-}
    ports:
      - "${HTTP_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inv_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inv_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - backend
    networks:
      - inv_network
      - homelab_network

volumes:
  postgres_data:
  redis_data:

networks:
  inv_network:
    driver: bridge
  homelab_network:
    external: true
